<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#6366f1" opacity="0.08"/>
  <circle cx="150" cy="530" r="150" fill="#8b5cf6" opacity="0.06"/>
  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="80" rx="3" fill="url(#accent)"/>
  <!-- Site name -->
  <text x="110" y="310" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="white">All Media Tools</text>
  <!-- Tagline -->
  <text x="110" y="365" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Free Online Image, PDF, Video &amp; AI Tools</text>
  <!-- Feature pills -->
  <rect x="110" y="405" width="180" height="44" rx="22" fill="#6366f1" opacity="0.9"/>
  <text x="200" y="432" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Remove BG</text>
  <rect x="306" y="405" width="180" height="44" rx="22" fill="#8b5cf6" opacity="0.9"/>
  <text x="396" y="432" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">AI Upscaler</text>
  <rect x="502" y="405" width="140" height="44" rx="22" fill="#06b6d4" opacity="0.8"/>
  <text x="572" y="432" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">OCR</text>
  <rect x="658" y="405" width="180" height="44" rx="22" fill="#10b981" opacity="0.8"/>
  <text x="748" y="432" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Compress</text>
  <rect x="854" y="405" width="140" height="44" rx="22" fill="#f59e0b" opacity="0.8"/>
  <text x="924" y="432" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">PDF</text>
  <!-- URL -->
  <text x="110" y="540" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" fill="#6366f1">allmediatool.online</text>
  <!-- Free badge -->
  <rect x="1030" y="540" width="90" height="36" rx="18" fill="#10b981"/>
  <text x="1075" y="563" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">100% Free</text>
</svg>
