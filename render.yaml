services:
  - type: web
    name: allmedia-tools
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: WORK_TMP_DIR
        value: /tmp/allmedia_work
      - key: ALLOWED_ORIGINS
        value: "https://allmediatool.online,https://www.allmediatool.online"
